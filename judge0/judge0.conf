# --- Server Configuration ---
MAINTENANCE_MODE=false
ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=false

# --- Authentication ---
AUTHN_HEADER=X-Judge0-Token
AUTHN_TOKEN=mca-lab-portal-token
AUTHZ_HEADER=X-Judge0-Token
AUTHZ_TOKEN=mca-lab-portal-token

# --- Access Control ---
ALLOWED_IPS=0.0.0.0/0
ALLOWED_ORIGINS=*

# --- Redis ---
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0-redis-password

# --- PostgreSQL ---
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0-postgres-password

# --- Submission Limits ---
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=30
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=120
MAX_FILE_SIZE=1024
ENABLE_NETWORK=false

# --- Workers ---
INTERVAL=0.1
COUNT=2
MAX_QUEUE_SIZE=100

# --- Rails ---
RAILS_ENV=production
SECRET_KEY_BASE=judge0-secret-key-base-change-in-production
RAILS_SERVE_STATIC_FILES=true
RAILS_LOG_TO_STDOUT=true
